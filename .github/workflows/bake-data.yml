name: Refresh data snapshots

on:
  schedule:
    # 05:20 UTC daily. NSIDC posts the previous day's extent overnight, and
    # this is comfortably after that without competing with their peak load.
    - cron: "20 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch sources that block cross-origin browser requests
        # NSIDC, NDBC, GISTEMP and Argo send no CORS headers, so the browser
        # cannot fetch them directly. Everything else the platform uses (NASA
        # GIBS, NOAA ERDDAP, OBIS, GEBCO) is fetched live by the client and is
        # deliberately not baked here.
        run: npm run bake

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet Pillow

      - name: Add any newly available sea-ice map frames
        # Only downloads frames that do not already exist, so this is cheap on
        # every run after the first. New frames appear when a year's minimum or
        # maximum is finalised, plus the rolling "latest" frame.
        run: python scripts/bake-ice-maps.py north

      - name: Commit refreshed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/ice
          if git diff --staged --quiet; then
            echo "No change in any source today."
          else
            git commit -m "Refresh data snapshots ($(date -u +%Y-%m-%d))"
            git push
          fi
