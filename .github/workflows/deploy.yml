name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deployment at a time; a queued run supersedes an older one rather
# than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          # No secret required. The access gate ships as a committed
          # public/gate.json holding only a salted PBKDF2/AES-GCM ciphertext,
          # so the passphrase itself is nowhere in the repository or the build.
          # To change the passphrase, run `APP_PASSWORD='…' npm run gate`
          # locally and commit the regenerated file.
          #
          # Project pages are served from /<repo>/, so assets need the prefix.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Disable Jekyll processing
        # Without this, GitHub Pages ignores Next's _next/ directory entirely.
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
